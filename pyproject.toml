[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nperf"
version = "0.1.0"
description = "Cross-platform network throughput and diagnostics tool (client/server, CLI/Web UI)"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.30",
    "ipwhois>=1.2.0",
    "pandas>=2.0",
]

[project.scripts]
nperf = "nperf.cli:main"

[tool.setuptools.packages.find]
include = ["nperf*"]
